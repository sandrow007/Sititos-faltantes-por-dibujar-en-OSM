<style>
:root{--ink:#242522;--muted:#65685f;--paper:#f4f4f0;--line:#d8d9d2;--accent:#5b5bd6}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.4 system-ui,sans-serif;color:var(--ink);background:var(--paper);overflow:hidden}
#visor{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#visor:active{cursor:grabbing}
#hud{position:fixed;top:14px;left:14px;z-index:2;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-width:min(420px,calc(100vw - 28px));max-height:calc(100dvh - 28px);overflow-y:auto;box-shadow:0 4px 18px rgba(0,0,0,.08)}
h1{font:16px/1.2 Georgia,serif;margin:0 0 4px}
.meta{color:var(--muted);font-size:12px;margin:0 0 9px}
label{display:flex;gap:7px;align-items:center;font-size:13px;min-height:30px}
button{font:12px/1 system-ui,sans-serif;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;margin:0 6px 6px 0}
button:hover{background:var(--paper)}
button.activo{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=search]{width:100%;font:13px system-ui,sans-serif;border:1px solid var(--line);border-radius:8px;padding:7px 10px;background:#fff;color:var(--ink)}
.fila{display:flex;flex-wrap:wrap;align-items:center;margin:4px 0}
.grupo{border-top:1px solid var(--line);margin-top:8px;padding-top:8px}
.grupo-t{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:2px 0 6px}
.chk{display:inline-flex;gap:5px;align-items:center;font-size:12px;border:1px solid var(--line);border-radius:999px;padding:4px 10px;margin:0 6px 6px 0;background:#fff;cursor:pointer;user-select:none}
.chk input{accent-color:var(--accent)}
#barra{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
#barra i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
#estado{font-size:12px;color:var(--muted);margin-top:6px}
#fps{position:fixed;top:14px;right:14px;z-index:2;font-size:11px;color:var(--muted);background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
#tip{position:fixed;z-index:3;pointer-events:none;background:rgba(36,37,34,.92);color:#fff;font-size:12px;padding:5px 9px;border-radius:7px;transform:translate(-50%,calc(-100% - 12px));white-space:nowrap;display:none}
#ayuda{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:2;font-size:11px;color:var(--muted);background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:999px;padding:5px 14px;white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
#fallo{position:fixed;inset:0;display:grid;place-items:center;background:var(--paper);padding:24px;text-align:center;color:var(--muted)}
#plegar{float:right;margin:0 0 4px 8px;font-size:13px;padding:4px 9px}
#hud.min .cuerpo{display:none}
[hidden]{display:none!important}
</style>

  if(camara.aspect<1){const k=1.75;generalPos.set(c.x+(generalPos.x-c.x)*k,c.y+(generalPos.y-c.y)*k,c.z+(generalPos.z-c.z)*k)}
  cenitalPos=new THREE.Vector3(c.x,c.y+r*1.05,c.z);
  camara.position.copy(generalPos);controles.target.copy(c);controles.maxDistance=r*2.2;controles.update();
  barra.parentElement.hidden=true;
  estado.textContent='Modelo cargado · '+Object.keys(CAT).length+' capas';
  window.__SCENE_READY__=true;necesitaRender=true;
 },x=>{if(x.total)barra.style.width=Math.round(x.loaded/x.total*100)+'%'},e=>{estado.textContent='Error al cargar Mairena_Elefante_Real.glb';console.error(e)});

 // ---- ir a un lugar ----
 function irAlLugar(){
  const q=buscar.value.trim();
  if(!q)return;
  const l=LUGARES.find(l=>l.n===q)||LUGARES.find(l=>l.n.toLowerCase().includes(q.toLowerCase()));
  if(!l){estado.textContent='Lugar no encontrado: '+q;return}
  const t=new THREE.Vector3(l.x,.05,l.z);
  const d=2.6;
  const p=new THREE.Vector3(l.x+d*.55,d*.75,l.z+d*.5);
  volar(p,t,1.1);
 }
 document.getElementById('ir').addEventListener('click',irAlLugar);
 buscar.addEventListener('keydown',e=>{if(e.key==='Enter')irAlLugar()});

 // ---- girar (turntable) ----
 const btnGirar=document.getElementById('girar');
 btnGirar.addEventListener('click',()=>{
  controles.autoRotate=!controles.autoRotate;
  btnGirar.classList.toggle('activo',controles.autoRotate);
  btnGirar.setAttribute('aria-pressed',controles.autoRotate);
  necesitaRender=true;
 });

 // ---- capturar PNG ----
 document.getElementById('png').addEventListener('click',()=>{
  renderer.render(escena,camara);
  canvas.toBlob(b=>{
   const a=document.createElement('a');
   a.href=URL.createObjectURL(b);a.download='mairena-3d.png';a.click();
   setTimeout(()=>URL.revokeObjectURL(a.href),5000);
  },'image/png');
 });

 // ---- panel plegable ----
 const hud=document.getElementById('hud'),btnPlegar=document.getElementById('plegar');
 function setPlegado(m){hud.classList.toggle('min',m);btnPlegar.textContent=m?'+':'–'}
 btnPlegar.addEventListener('click',()=>setPlegado(!hud.classList.contains('min')));
 if(innerWidth<520)setPlegado(true);

 // ---- etiquetas ----
 let etiquetasObj=null,cargandoEtq=false;
 document.getElementById('etiquetas').addEventListener('change',async e=>{
  try{
   if(e.target.checked){
    if(!etiquetasObj&&!cargandoEtq){cargandoEtq=true;etiquetasObj=(await cargador.loadAsync('./Mairena_Etiquetas.glb')).scene}
    if(etiquetasObj&&!etiquetasObj.parent)raiz.add(etiquetasObj);
   }else if(etiquetasObj)raiz.remove(etiquetasObj);
   necesitaRender=true;
  }catch(err){estado.textContent='No se pudieron cargar las etiquetas';console.error(err)}
 });

 // ---- terreno/base ----
 document.getElementById('terreno').addEventListener('change',e=>{
  const on=e.target.checked;
  raiz.traverse(o=>{if(o.userData.base)o.visible=on});
  necesitaRender=true;
 });

 // ---- ratón: hover + clic para acercar ----
 const rayo=new THREE.Raycaster();rayo.firstHitOnly=true;
 const raton=new THREE.Vector2();let hover=null,downPos=null,downT=0;
 const matResalte=new THREE.MeshBasicMaterial({color:0x3a3ad6,transparent:true,opacity:.35,depthTest:true});
 function pick(ev){
  const r=canvas.getBoundingClientRect();
  raton.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);
  rayo.setFromCamera(raton,camara);
  const hits=rayo.intersectObjects(raiz.children,true);
  for(const h of hits){if(h.object.visible&&h.object.isMesh&&h.distance>1e-4)return h}
  return null;
 }
 let ultRayo=0;
 canvas.addEventListener('pointermove',ev=>{
  if(!window.__SCENE_READY__)return;
  const ahora=performance.now();
  if(ahora-ultRayo<70)return;
  ultRayo=ahora;
  const h=pick(ev);
  const obj=h?h.object:null;
  if(hover&&hover!==obj){hover.material=hover.userData.matOrig;hover=null;tip.style.display='none'}
  if(obj&&hover!==obj){
   if(!obj.userData.matOrig)obj.userData.matOrig=obj.material;
   if(obj.userData.matOrig.emissive){obj.userData.matOrigSaved=obj.userData.matOrig.clone();obj.material=obj.userData.matOrigSaved;obj.material.emissive.setHex(0x3a3ad6);obj.material.emissiveIntensity=.6}
   else{obj.material=matResalte}
   hover=obj;
  }
  if(h){tip.textContent=obj.userData.cat;tip.style.display='block';tip.style.left=ev.clientX+'px';tip.style.top=ev.clientY+'px';canvas.style.cursor='pointer'}
  else canvas.style.cursor='';
  necesitaRender=true;
 });
 canvas.addEventListener('pointerdown',ev=>{downPos=[ev.clientX,ev.clientY];downT=performance.now()});
 canvas.addEventListener('pointerup',ev=>{
  if(!downPos||!window.__SCENE_READY__)return;
  const dx=ev.clientX-downPos[0],dy=ev.clientY-downPos[1];
  const esClic=Math.hypot(dx,dy)<6&&performance.now()-downT<400;
  downPos=null;
  if(!esClic)return;
  const h=pick(ev);if(!h)return;
  const d=camara.position.distanceTo(h.point);
  const nuevoTarget=h.point.clone();
  const dir=camara.position.clone().sub(controles.target).normalize();
  const nuevoPos=nuevoTarget.clone().add(dir.multiplyScalar(Math.max(.12,d*.35)));
  volar(nuevoPos,nuevoTarget,.8);
 });

 // ---- botones ----
 document.getElementById('reiniciar').addEventListener('click',()=>volar(generalPos,generalTarget,1));
 document.getElementById('cenital').addEventListener('click',()=>volar(cenitalPos,generalTarget,1));
 canvas.addEventListener('dblclick',()=>volar(generalPos,generalTarget,1));
}catch(err){document.getElementById('fallo').hidden=false;console.error(err)}
</script>
