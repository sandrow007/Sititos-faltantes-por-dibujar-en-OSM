<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mairena del Aljarafe · Visor 3D</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'><rect width='16' height='16' fill='%23f4f4f0'/><rect x='4' y='6' width='4' height='7' fill='%235b5bd6'/><rect x='9' y='3' width='4' height='10' fill='%23b58ae0'/></svg>">
<style>
:root{--ink:#242522;--muted:#65685f;--paper:#f4f4f0;--line:#d8d9d2;--accent:#5b5bd6}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{font:14px/1.4 system-ui,sans-serif;color:var(--ink);background:var(--paper);overflow:hidden}
#visor{width:100%;height:100%;display:block;touch-action:none;cursor:grab}
#visor:active{cursor:grabbing}
#hud{position:fixed;top:14px;left:14px;z-index:2;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);border:1px solid var(--line);border-radius:12px;padding:12px 14px;max-width:min(400px,calc(100vw - 28px));box-shadow:0 4px 18px rgba(0,0,0,.08)}
h1{font:16px/1.2 Georgia,serif;margin:0 0 4px}
.meta{color:var(--muted);font-size:12px;margin:0 0 9px}
label{display:flex;gap:7px;align-items:center;font-size:13px;min-height:30px}
button{font:12px/1 system-ui,sans-serif;border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 10px;cursor:pointer;margin-right:6px}
button:hover{background:var(--paper)}
#barra{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}
#barra i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
#estado{font-size:12px;color:var(--muted);margin-top:6px}
#fps{position:fixed;top:14px;right:14px;z-index:2;font-size:11px;color:var(--muted);background:rgba(255,255,255,.85);border:1px solid var(--line);border-radius:8px;padding:4px 8px}
#tip{position:fixed;z-index:3;pointer-events:none;background:rgba(36,37,34,.92);color:#fff;font-size:12px;padding:5px 9px;border-radius:7px;transform:translate(-50%,calc(-100% - 12px));white-space:nowrap;display:none}
#ayuda{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);z-index:2;font-size:11px;color:var(--muted);background:rgba(255,255,255,.8);border:1px solid var(--line);border-radius:999px;padding:5px 14px;white-space:nowrap;max-width:calc(100vw - 24px);overflow:hidden;text-overflow:ellipsis}
#fallo{position:fixed;inset:0;display:grid;place-items:center;background:var(--paper);padding:24px;text-align:center;color:var(--muted)}
[hidden]{display:none!important}
</style>
<script type="importmap">{"imports":{"three":"./vendor/three.module.js","three/addons/":"./vendor/","three-mesh-bvh":"./vendor/three-mesh-bvh.module.js"}}</script>
</head>
<body>
<canvas id="visor" aria-label="Modelo 3D de Mairena del Aljarafe"></canvas>
<section id="hud">
  <h1>Mairena del Aljarafe · 3D</h1>
  <p class="meta">Catastro + OSM + inventario municipal</p>
  <label><input id="etiquetas" type="checkbox"> Mostrar nombres</label>
  <label><input id="terreno" type="checkbox"> Mostrar terreno y base</label>
  <div><button id="reiniciar">Vista general</button><button id="cenital">Vista cenital</button></div>
  <div id="barra"><i></i></div>
  <div id="estado">Cargando modelo…</div>
</section>
<div id="fps" hidden></div>
<div id="tip"></div>
<div id="ayuda">Arrastra: girar · Rueda: zoom · Clic derecho: desplazar · Doble clic / clic en edificio: acercar · Mayús+arrastrar: paneo</div>
<div id="fallo" hidden><div><strong>No se pudo iniciar WebGL.</strong><br>Prueba en un navegador moderno o abre el GLB en Blender.</div></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import {DRACOLoader} from 'three/addons/loaders/DRACOLoader.js';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {computeBoundsTree,disposeBoundsTree,acceleratedRaycast} from 'three-mesh-bvh';
THREE.BufferGeometry.prototype.computeBoundsTree=computeBoundsTree;
THREE.BufferGeometry.prototype.disposeBoundsTree=disposeBoundsTree;
THREE.Mesh.prototype.raycast=acceleratedRaycast;

const canvas=document.getElementById('visor'),estado=document.getElementById('estado'),
      barra=document.querySelector('#barra i'),tip=document.getElementById('tip'),
      fpsBox=document.getElementById('fps');
window.__seek=()=>{};window.__SCENE_READY__=false;

const CAT={ // material → etiqueta legible (clave sin acentos ni símbolos)
 'osm street network':'Vía OSM','main osm streets':'Calle principal','official parks and gardens':'Parque o jardín oficial',
 'empty municipal tree pits':'Alcorque vacío (inventario)','catastro missing in osm':'Edificio en Catastro ausente en OSM',
 'violet roof equipment':'Equipamiento en cubierta','estimated extrusion':'Extrusión estimada (sin altura)',
 'pale lavender roof':'Cubierta','osm documented height':'Altura documentada OSM',
 'blue grey windows':'Ventanal','limestone cut edge':'Borde de base','osm trees':'Árbol OSM',
 'municipal inventory trees':'Árbol (inventario municipal)','ivory municipal terrain':'Terreno'};
const norm=s=>(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim();
function catDe(mat){
 const n=norm(mat);
 for(const k in CAT)if(n.startsWith(k))return CAT[k];
 return mat||'Elemento'}

try{
 const renderer=new THREE.WebGLRenderer({canvas,antialias:true,powerPreference:'high-performance'});
 const DPR_MAX=Math.min(devicePixelRatio,2);
 let dpr=DPR_MAX;
 renderer.setPixelRatio(dpr);renderer.setClearColor(0xf4f4f0,1);
 renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1;

 const escena=new THREE.Scene();escena.background=new THREE.Color(0xf4f4f0);
 escena.add(new THREE.HemisphereLight(0xffffff,0x88908a,2.4));
 const sol=new THREE.DirectionalLight(0xffffff,2.3);sol.position.set(8,-12,20);escena.add(sol);

 const camara=new THREE.PerspectiveCamera(38,1,.01,400);camara.up.set(0,0,1); // el modelo tiene Z arriba
 const controles=new OrbitControls(camara,canvas);
 controles.enableDamping=true;controles.dampingFactor=.08;controles.rotateSpeed=.55;
 controles.zoomSpeed=.9;controles.panSpeed=.8;controles.screenSpacePanning=false;
 controles.maxPolarAngle=Math.PI*.495;controles.minDistance=.05;
 controles.mouseButtons={LEFT:THREE.MOUSE.ROTATE,MIDDLE:THREE.MOUSE.DOLLY,RIGHT:THREE.MOUSE.PAN};
 controles.touches={ONE:THREE.TOUCH.ROTATE,TWO:THREE.TOUCH.DOLLY_PAN};

 const draco=new DRACOLoader().setDecoderPath('./vendor/draco/');
 const cargador=new GLTFLoader().setDRACOLoader(draco);
 const raiz=new THREE.Group();escena.add(raiz);
 let caja,cenitalPos,generalPos,generalTarget;

 function ajustar(){const r=canvas.getBoundingClientRect(),w=Math.max(1,r.width|0),h=Math.max(1,r.height|0);renderer.setSize(w,h,false);camara.aspect=w/h;camara.updateProjectionMatrix()}
 new ResizeObserver(ajustar).observe(canvas);ajustar();

 // ---- vuelo suave de cámara ----
 const vuelo={activo:false,t:0,dur:.9,deP:new THREE.Vector3(),aP:new THREE.Vector3(),deT:new THREE.Vector3(),aT:new THREE.Vector3()};
 function volar(aP,aT,dur=.9){vuelo.deP.copy(camara.position);vuelo.aP.copy(aP);vuelo.deT.copy(controles.target);vuelo.aT.copy(aT);vuelo.t=0;vuelo.dur=dur;vuelo.activo=true}
 const ease=t=>t<.5?4*t*t*t:1-Math.pow(-2*t+2,3)/2;

 // ---- render sólo cuando hace falta, con adaptación de resolución ----
 let necesitaRender=true,frames=0,ultT=performance.now(),acumFps=0,nFps=0;
 controles.addEventListener('change',()=>necesitaRender=true);
 canvas.addEventListener('pointermove',()=>necesitaRender=true);
 function bajarDPR(){if(dpr>1){dpr=Math.max(1,dpr-.25);renderer.setPixelRatio(dpr);necesitaRender=true}}

 (function animar(t){
  requestAnimationFrame(animar);
  // medición de fluidez
  const dt=t-ultT;ultT=t;acumFps+=dt;nFps++;
  if(acumFps>=1000){const f=Math.round(1000/(acumFps/nFps));fpsBox.hidden=false;fpsBox.textContent=f+' fps';if(f<42)bajarDPR();acumFps=0;nFps=0}
  if(vuelo.activo){vuelo.t+=dt/(vuelo.dur*1000);const k=ease(Math.min(1,vuelo.t));camara.position.lerpVectors(vuelo.deP,vuelo.aP,k);controles.target.lerpVectors(vuelo.deT,vuelo.aT,k);if(vuelo.t>=1)vuelo.activo=false;necesitaRender=true}
  const moviendo=controles.update();
  if(moviendo)necesitaRender=true;
  if(necesitaRender){renderer.render(escena,camara);necesitaRender=vuelo.activo}
 })(performance.now());

 // ---- carga del modelo ----
 cargador.load('./Mairena_Elefante_Real.glb',g=>{
  raiz.add(g.scene);
  g.scene.traverse(o=>{
   if(!o.isMesh)return;
   o.userData.cat=catDe(o.material?.name);
   if(!o.geometry.boundsTree)o.geometry.computeBoundsTree();
   // el terreno/base sólido oculta el modelo: fuera por defecto
   const nn=norm(o.name+' '+norm(o.parent?.name));
   if(/terrain|boundary|solid base|limestone/.test(nn)){(o.userData.base=o).visible=false}
  });
  // precalcula materiales de resaltado por categoría
  caja=new THREE.Box3().setFromObject(g.scene);
  const c=caja.getCenter(new THREE.Vector3()),s=caja.getSize(new THREE.Vector3()),r=Math.max(s.x,s.y,s.z);
  generalTarget=c.clone();
  generalPos=new THREE.Vector3(c.x+r*.12,c.y-r*.9,c.z+r*.55);
  cenitalPos=new THREE.Vector3(c.x,c.y,c.z+r*1.05);
  camara.position.copy(generalPos);controles.target.copy(c);controles.maxDistance=r*2.2;controles.update();
  barra.parentElement.hidden=true;
  estado.textContent='Modelo cargado · '+Object.keys(CAT).length+' capas';
  window.__SCENE_READY__=true;necesitaRender=true;
  window.__DEBUG__={c:c.toArray(),s:s.toArray(),r,generalPos:generalPos.toArray(),cam:camara.position.toArray()};
 },x=>{if(x.total)barra.style.width=Math.round(x.loaded/x.total*100)+'%'},e=>{estado.textContent='Error al cargar Mairena_Elefante_Real.glb';console.error(e)});

 // ---- etiquetas ----
 let etiquetasObj=null,cargandoEtq=false;
 document.getElementById('etiquetas').addEventListener('change',async e=>{
  try{
   if(e.target.checked){
    if(!etiquetasObj&&!cargandoEtq){cargandoEtq=true;etiquetasObj=(await cargador.loadAsync('./Mairena_Etiquetas.glb')).scene}
    if(etiquetasObj&&!etiquetasObj.parent)raiz.add(etiquetasObj);
   }else if(etiquetasObj)raiz.remove(etiquetasObj);
   necesitaRender=true;
  }catch(err){estado.textContent='No se pudieron cargar las etiquetas';console.error(err)}
 });

 // ---- terreno/base ----
 document.getElementById('terreno').addEventListener('change',e=>{
  g_scene_bases().forEach(o=>o.visible=e.target.checked);necesitaRender=true;
 });
 function g_scene_bases(){const out=[];raiz.traverse(o=>{if(o.userData.base)out.push(o)});return out}

 // ---- ratón: hover + clic para acercar ----
 const rayo=new THREE.Raycaster();rayo.firstHitOnly=true;
 const raton=new THREE.Vector2();let hover=null,downPos=null,downT=0;
 const matResalte=new THREE.MeshBasicMaterial({color:0x3a3ad6,transparent:true,opacity:.35,depthTest:true});
 function pick(ev){
  const r=canvas.getBoundingClientRect();
  raton.set(((ev.clientX-r.left)/r.width)*2-1,-((ev.clientY-r.top)/r.height)*2+1);
  rayo.setFromCamera(raton,camara);
  const hits=rayo.intersectObjects(raiz.children,true);
  for(const h of hits){if(h.object.visible&&h.object.isMesh&&h.distance>1e-4)return h}
  return null;
 }
 let ultRayo=0;
 canvas.addEventListener('pointermove',ev=>{
  if(!window.__SCENE_READY__)return;
  const ahora=performance.now();
  if(ahora-ultRayo<70)return; // limita el raycast para no frenar la escena
  ultRayo=ahora;
  const h=pick(ev);
  const obj=h?h.object:null;
  if(hover&&hover!==obj){hover.material=hover.userData.matOrig;hover=null;tip.style.display='none'}
  if(obj&&hover!==obj){
   if(!obj.userData.matOrig)obj.userData.matOrig=obj.material;
   // resalta sin romper el material: emisión temporal si existe, si no overlay
   if(obj.userData.matOrig.emissive){obj.userData.matOrigSaved=obj.userData.matOrig.clone();obj.material=obj.userData.matOrigSaved;obj.material.emissive.setHex(0x3a3ad6);obj.material.emissiveIntensity=.6}
   else{obj.material=matResalte}
   hover=obj;
  }
  if(h){tip.textContent=obj.userData.cat;tip.style.display='block';tip.style.left=ev.clientX+'px';tip.style.top=ev.clientY+'px';canvas.style.cursor='pointer'}
  else canvas.style.cursor='';
  necesitaRender=true;
 });
 canvas.addEventListener('pointerdown',ev=>{downPos=[ev.clientX,ev.clientY];downT=performance.now()});
 canvas.addEventListener('pointerup',ev=>{
  if(!downPos||!window.__SCENE_READY__)return;
  const dx=ev.clientX-downPos[0],dy=ev.clientY-downPos[1];
  const esClic=Math.hypot(dx,dy)<6&&performance.now()-downT<400;
  downPos=null;
  if(!esClic)return;
  const h=pick(ev);if(!h)return;
  const p=h.point,n=h.face?h.face.normal:new THREE.Vector3(0,0,1);
  const centro=new THREE.Vector3();if(hover)hover.getWorldPosition(centro);
  const d=camara.position.distanceTo(h.point);
  const nuevoTarget=h.point.clone();
  const dir=camara.position.clone().sub(controles.target).normalize();
  const nuevoPos=nuevoTarget.clone().add(dir.multiplyScalar(Math.max(.12,d*.35)));
  volar(nuevoPos,nuevoTarget,.8);
 });

 // ---- botones ----
 document.getElementById('reiniciar').addEventListener('click',()=>volar(generalPos,generalTarget,1));
 document.getElementById('cenital').addEventListener('click',()=>volar(cenitalPos,generalTarget,1));
 canvas.addEventListener('dblclick',()=>volar(generalPos,generalTarget,1));
}catch(err){document.getElementById('fallo').hidden=false;console.error(err)}
</script>
</body>
</html>
